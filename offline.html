<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sin Conexión | Conversor Pro</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #F8FAFC;
            color: #1E293B;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 1.5rem;
            color: #4F46E5;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        p {
            font-size: 0.95rem;
            color: #64748B;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        button {
            background: #4F46E5;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        button:hover {
            background: #4338CA;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="card">
        <h1><i class="fas fa-wifi" style="font-size: 1.2rem;"></i> Sin conexión</h1>
        <p>Parece que perdiste la conexión a internet. Puedes seguir usando la calculadora y viendo las últimas tasas guardadas en caché.</p>
        <button onclick="window.location.reload()">
            <i class="fas fa-sync-alt"></i> Reintentar conexión
        </button>
    </div>
    <!-- FontAwesome para el icono (opcional, o usa un emoji 📶) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</body>
</html>
